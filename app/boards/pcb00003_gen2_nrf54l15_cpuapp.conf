# OTA uses the same MCUboot and mcumgr switches as prj.conf.
# The image now on the MAM has no bootloader, so the first copy of this
# build goes on over SWD as merged.hex. After that, Device Manager uses
# dfu_application.zip.
CONFIG_REBOOT=y
# Boot log was filling the 1 KB up-buffer before Advertising started.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Crystal load is not a measured value. The advertiser was proven on the RC.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# The advertiser halted in arch_system_halt during controller startup
# when the log thread stack was 768.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# LP270829 is not the CG-320B. 3487 mV is about 20% on this span, not empty.
CONFIG_ORALABLE_GAUGE_VMIN_MV=3300
CONFIG_ORALABLE_GAUGE_VMAX_MV=4200
