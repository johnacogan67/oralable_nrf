# OTA uses the same MCUboot and mcumgr switches as prj.conf.
# The module already has MCUboot. Device Manager takes dfu_application.zip.
# app/VERSION stays the Gen 1 number. This sign version is what Device
# Manager compares. 2.0.5+0 was built from an uncommitted tree. This
# image is 2.0.6+0 so the upload is accepted.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="2.0.6+0"
CONFIG_REBOOT=y
# Boot log was filling the 1 KB up-buffer before Advertising started.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Crystal load is not a measured value. The advertiser was proven on the RC.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# The advertiser halted in arch_system_halt during controller startup
# when the log thread stack was 768.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# LP270829, 35 mAh. Gauge 3300–4200 mV. 3487 mV is about 20% on this span, not empty.
# Minutes left uses 35 mAh. The 3900 mV red/IR line is unchanged.
CONFIG_ORALABLE_GAUGE_VMIN_MV=3300
CONFIG_ORALABLE_GAUGE_VMAX_MV=4200

# Pin-pair scan is a bench tool. The candidate image does not run it.
CONFIG_ORALABLE_I2C_PIN_SCAN=n
