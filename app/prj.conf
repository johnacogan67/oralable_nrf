# This file contains selected Kconfig options for the TGM application.

# Enable BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Oralable"

# Peripheral connection preferences (interval in 1.25ms units; supervision timeout in 10ms units).
# NCS defaults use a very short supervision timeout (~420ms), which drops nRF Connect / iOS
# links right after enabling notifications. Use 32s (NCS max for nRF52) so brief notify stalls do not drop the link.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=36
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=3200

# +4 dBm advertising/connection TX (nRF52832 max) — improves scan RSSI at ~30 cm cheek/temple range.
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Extra ACL/L2CAP TX buffers reduce bt_gatt_notify -ENOMEM under ACC+PPG+temp load.
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
CONFIG_BT_ATT_TX_COUNT=12

# For requesting ATT_MTU update
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DATA_LEN_UPDATE=y
# For data length update
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# Max supported by Nordic Softdevice controller
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# Maximum supported by Nordic Softdevice controller (Data length - 4)
CONFIG_BT_L2CAP_TX_MTU=247

# Enable Floating Point Unit
CONFIG_FPU=y

# Enable the sensor drivers
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADC=y

# PPG
CONFIG_MAXM86161=y
CONFIG_PPG_SAMPLES_PER_FRAME=20

# Accelerometer
CONFIG_LIS2DTW12=y
CONFIG_ACC_SAMPLES_PER_FRAME=25

# Battery
CONFIG_BATTERY_MEASUREMENT_INTERVAL=300

# LTC4124 STAT blinks while charging — treat edges as charge_active (FW >= 1.0.70).
CONFIG_CHRSTS_STAT_ACTIVITY=y

# Temperature
CONFIG_SENSOR=y
CONFIG_TEMPERATURE_MEASUREMENT_INTERVAL=1

# Phase 0 vitals: no dim-green connect probe (avoids solid-green confusion on bench).
CONFIG_TGM_CONNECT_PROBE_DURATION_S=0

# Debug periodic reboot — 0 = off (production). Set from iOS via 00B opcode 0x0A for bench.
CONFIG_TGM_DEBUG_REBOOT_INTERVAL_S=0

# PPG + ACC work handlers use large frames; avoid system workqueue overflow.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# Debugging
CONFIG_LOG=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# Sysbuild + board defconfig can emit deprecated-Kconfig warnings as errors.
CONFIG_WARN_DEPRECATED=n

# Required before sysbuild merges .config.sysbuild (nRF MCUboot Kconfig symbols).
CONFIG_BOOTLOADER_MCUBOOT=y

# DFU / OTA (MCUboot + mcumgr SMP over BLE)
# NCS sample helper wires the recommended OTA defaults (Academy Intermediate L9).
# For a fully custom production cut, replace with the explicit list below and
# enable CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN once pairing UX exists.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
# Static SMP GATT registration (avoids SYS_INIT-before-bt_enable miss).
CONFIG_MCUMGR_TRANSPORT_BT_DYNAMIC_SVC_REGISTRATION=n
# Production hardening (requires bonding/pairing with Device Manager):
# CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
