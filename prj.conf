# This file contains selected Kconfig options for the TGM application.

# Enable BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MAM"

# Peripheral connection preferences (interval in 1.25ms units; supervision timeout in 10ms units).
# NCS defaults use a very short supervision timeout (~420ms), which causes frequent iOS
# CBError.connectionTimeout under load, backgrounding, or bursty ATT traffic. Prefer >=2s.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=36
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
#
# Supervision timeout in 10ms units. 300 (=3s) is too short for iOS under load
# and can trigger CBError.connectionTimeout even with good RSSI. Prefer >=10s.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=1000

# For requesting ATT_MTU update
CONFIG_BT_GATT_CLIENT=y
# For data length update - requires BT_DATA_LEN_UPDATE
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# Max supported by Nordic Softdevice controller
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# Maximum supported by Nordic Softdevice controller (Data length - 4)
CONFIG_BT_L2CAP_TX_MTU=247

# Enable the sensor drivers
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADC=y

# PPG
CONFIG_MAXM86161=y
CONFIG_PPG_SAMPLES_PER_FRAME=20

# Accelerometer
CONFIG_LIS2DTW12=y
CONFIG_ACC_SAMPLES_PER_FRAME=25

# Battery - reduced from 300s to 10s for better iOS responsiveness
CONFIG_BATTERY_MEASUREMENT_INTERVAL=10
CONFIG_BATTERY_CRITICAL_LOW_SHUTDOWN=y

# Reboot for critical low voltage shutdown
CONFIG_REBOOT=y

# Temperature
CONFIG_TEMPERATURE_MEASUREMENT_INTERVAL=1

# Debugging
CONFIG_LOG=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# J-Link RTT logging (lets us see BLE connect/disconnect reasons live).
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# Route printk/console to SEGGER RTT so buffer 0 + control block exist from boot
# (J-Link RTT Client / RTTLogger can attach without hunting forever).
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
# CONFIG_UART_CONSOLE is not set

# DFU functionality
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_BOOTLOADER_MCUBOOT=y

# Ensure SMP (mcumgr over BLE) GATT service is present.
# nRF Connect Device Manager requires the SMP service to connect.
# Do NOT set CONFIG_BT_DFU_SMP here — that is the central SMP *client*
# (Central SMP Client sample), not the peripheral OTA server path.
# Canonical DFU Kconfigs live in app/prj.conf (west build -b pcb00003 … app).
CONFIG_MCUMGR=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y

# Register SMP GATT statically. Dynamic registration runs from SYS_INIT before our
# app calls bt_enable(), which can result in no SMP service at runtime.
CONFIG_MCUMGR_TRANSPORT_BT_DYNAMIC_SVC_REGISTRATION=n
